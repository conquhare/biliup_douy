name: Deliver build artifact to builds branch

# 把已构建成功的 artifact 以 git 文件形式发布到 `builds` 分支，
# 这样本机可用 raw.githubusercontent.com（公开仓库免鉴权）直接拉取，
# 绕开 GitHub 对「PAT 下载 workflow artifact / release asset」的限制（2025 起 403）。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source workflow run id (e.g. 39128905870)'
        required: true
      artifact_name:
        description: 'Artifact name to download'
        required: true
        default: 'biliup-windows-exe-nuitka'

jobs:
  deliver:
    permissions:
      contents: write   # 允许 force-push 到 builds 分支
      actions: read     # 允许 gh run download 拉取 artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact from source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" \
            --name "${{ inputs.artifact_name }}" -D dl
          echo "=== downloaded ==="
          find dl -type f -exec ls -la {} \;

      - name: Locate inner nuitka zip
        id: loc
        run: |
          ZIP=$(find dl -name 'biliup-*-x86_64-windows-nuitka.zip' | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find dl -name '*.zip' | head -1)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::no zip found in artifact"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "found: $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Publish to builds branch (orphan, force)
        run: |
          ZIP="${{ steps.loc.outputs.zip }}"
          cp "$ZIP" /tmp/biliup-dist.zip
          git config user.email "deliver-bot@users.noreply.github.com"
          git config user.name "deliver-bot"
          git checkout --orphan builds
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/biliup-dist.zip biliup-dist.zip
          git add biliup-dist.zip
          git commit -m "deliver build ${{ inputs.run_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f origin builds

      - name: Report raw URL
        run: |
          echo "::notice::Download via: https://raw.githubusercontent.com/${{ github.repository }}/builds/biliup-dist.zip"
